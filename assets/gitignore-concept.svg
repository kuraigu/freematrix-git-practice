<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-code { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 600; }
      .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .arrow { stroke-width: 2.5; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="880" height="320" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Box: Working Directory -->
  <g transform="translate(24, 24)">
    <rect width="260" height="272" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="34" rx="10" fill="#f1f5f9"/>
    <text x="14" y="22" class="badge-label" fill="#475569">Your Computer Files</text>
    <text x="14" y="60" class="text-title">Working Directory</text>
    <text x="14" y="78" class="text-sub">All files currently on your disk:</text>
    
    <!-- Allowed File 1 -->
    <rect x="14" y="94" width="232" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="114" class="text-code" fill="#15803d">📄 profile.md (Safe)</text>

    <!-- Allowed File 2 -->
    <rect x="14" y="134" width="232" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="154" class="text-code" fill="#15803d">📄 README.md (Safe)</text>

    <!-- Ignored File 1 (Secret) -->
    <rect x="14" y="174" width="232" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="24" y="194" class="text-code" fill="#b91c1c">🔒 .env (API Key Secret)</text>

    <!-- Ignored File 2 (Clutter) -->
    <rect x="14" y="214" width="232" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="24" y="234" class="text-code" fill="#b91c1c">🗑️ .DS_Store (OS Clutter)</text>
  </g>

  <!-- Center: The .gitignore Filter Shield -->
  <g transform="translate(324, 24)">
    <rect width="230" height="272" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="230" height="34" rx="10" fill="#fef3c7"/>
    <text x="14" y="22" class="badge-label" fill="#b45309">The Filter Shield</text>
    <text x="14" y="60" class="text-title" fill="#92400e">.gitignore File</text>
    <text x="14" y="78" class="text-sub">Rules of files to ignore:</text>

    <rect x="14" y="94" width="202" height="152" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="24" y="118" class="text-code" fill="#78350f"># Secrets</text>
    <text x="24" y="136" class="text-code" fill="#b45309">.env</text>
    <text x="24" y="154" class="text-code" fill="#b45309">*.key</text>
    <text x="24" y="176" class="text-code" fill="#78350f"># OS Files</text>
    <text x="24" y="194" class="text-code" fill="#b45309">.DS_Store</text>
    <text x="24" y="212" class="text-code" fill="#b45309">Thumbs.db</text>
    <text x="24" y="232" class="text-code" fill="#b45309">node_modules/</text>
  </g>

  <!-- Top Allowed Path: Through to Staging Area -->
  <path d="M 284 126 L 324 126" class="arrow" stroke="#10b981"/>
  <path d="M 554 126 L 594 126" class="arrow" stroke="#10b981" marker-end="url(#arrow-green)"/>

  <!-- Blocked Path: Blocked and dropped -->
  <path d="M 284 214 L 324 214" class="arrow" stroke="#ef4444"/>
  <circle cx="340" cy="214" r="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="336" y="219" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">✕</text>

  <!-- Right Box: Staging Area -->
  <g transform="translate(594, 24)">
    <rect width="260" height="272" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="34" rx="10" fill="#ecfdf5"/>
    <text x="14" y="22" class="badge-label" fill="#047857">Clean Staging Area</text>
    <text x="14" y="60" class="text-title" fill="#065f46">git status / git add</text>
    <text x="14" y="78" class="text-sub">Only intended files get tracked:</text>

    <rect x="14" y="94" width="232" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="114" class="text-code" fill="#15803d">✓ community/your-name/</text>

    <rect x="14" y="134" width="232" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="154" class="text-code" fill="#15803d">✓ README.md</text>

    <rect x="14" y="180" width="232" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="202" class="text-sub" font-weight="600" fill="#0f172a">Protected from accidental leaks:</text>
    <text x="24" y="218" class="text-sub">No secrets or temp files ever reach</text>
    <text x="24" y="232" class="text-sub">the public GitHub repository.</text>
  </g>
</svg>
