<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .mono-pill { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 10px; font-weight: 600; fill: #ffffff; }
      .arrow { stroke-width: 2; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="920" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Column: Model A (Direct Clone) -->
  <g transform="translate(24, 24)">
    <rect width="420" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="420" height="42" rx="12" fill="#eff6ff"/>
    <path d="M 0 42 L 420 42" stroke="#dbeafe" stroke-width="1"/>
    <circle cx="24" cy="21" r="10" fill="#2563eb"/>
    <text x="21" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">A</text>
    <text x="44" y="25" class="badge-title" fill="#1e40af">Model A: Direct Clone (Team Collaborator)</text>

    <!-- Top Box: Central Company Repo -->
    <g transform="translate(35, 62)">
      <rect width="350" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="28" class="title" fill="#166534">Central GitHub Repository</text>
      <text x="16" y="48" class="subtext">github.com/FreeMatrixStudios/GitPractice</text>
      <rect x="16" y="56" width="130" height="18" rx="4" fill="#dcfce7"/>
      <text x="22" y="69" class="subtext" fill="#15803d" font-weight="600">All members are collaborators</text>
    </g>

    <!-- Direct Arrows between Central Repo & Laptop -->
    <!-- Down Arrow: 1. git clone -->
    <path d="M 120 148 L 120 226" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <rect x="68" y="176" width="105" height="20" rx="10" fill="#2563eb"/>
    <text x="75" y="190" class="mono-pill">1. git clone</text>

    <!-- Up Arrow: 2. git push & 3. PR -->
    <path d="M 300 226 L 300 148" class="arrow" stroke="#10b981" marker-end="url(#arrow-green)"/>
    <rect x="238" y="165" width="124" height="20" rx="10" fill="#10b981"/>
    <text x="246" y="179" class="mono-pill">2. push community/name</text>
    <rect x="238" y="190" width="124" height="20" rx="10" fill="#047857"/>
    <text x="248" y="204" class="mono-pill">3. Pull Request (PR)</text>

    <!-- Bottom Box: Laptop -->
    <g transform="translate(35, 230)">
      <rect width="350" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="16" y="28" class="title">Your Laptop (Local Machine)</text>
      <text x="16" y="48" class="subtext">• Clones directly from project repository</text>
      <text x="16" y="66" class="subtext">• Creates branch: git switch -c community/your-name</text>
      <text x="16" y="84" class="subtext">• Pushes branch directly to origin</text>
      <rect x="16" y="96" width="318" height="20" rx="4" fill="#f1f5f9"/>
      <text x="24" y="110" class="subtext" font-weight="600" fill="#334155">One remote: origin = shared project repo</text>
    </g>
  </g>

  <!-- Right Column: Model B (Fork & Pull) -->
  <g transform="translate(476, 24)">
    <rect width="420" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="420" height="42" rx="12" fill="#faf5ff"/>
    <path d="M 0 42 L 420 42" stroke="#f3e8ff" stroke-width="1"/>
    <circle cx="24" cy="21" r="10" fill="#7c3aed"/>
    <text x="21" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">B</text>
    <text x="44" y="25" class="badge-title" fill="#6b21a8">Model B: Fork &amp; Pull (Open Source / Contractors)</text>

    <!-- Top Box: Original Upstream Repo -->
    <g transform="translate(25, 58)">
      <rect width="180" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="10" y="22" class="title" font-size="12" fill="#166534">Original Repo</text>
      <text x="10" y="38" class="subtext" font-size="10">kuraigu/GitPractice</text>
      <text x="10" y="54" class="subtext" font-size="10" font-weight="600" fill="#15803d">(remote: upstream)</text>
    </g>

    <!-- Fork Arrow on GitHub -->
    <path d="M 205 91 L 225 91" class="arrow" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
    <rect x="194" y="65" width="45" height="18" rx="9" fill="#7c3aed"/>
    <text x="199" y="78" class="mono-pill" font-size="9">Fork</text>

    <!-- Top Right Box: Personal Fork -->
    <g transform="translate(230, 58)">
      <rect width="165" height="66" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
      <text x="10" y="22" class="title" font-size="12" fill="#6b21a8">Your Fork</text>
      <text x="10" y="38" class="subtext" font-size="10">you/GitPractice</text>
      <text x="10" y="54" class="subtext" font-size="10" font-weight="600" fill="#7e22ce">(remote: origin)</text>
    </g>

    <!-- Cross-repo PR Arrow (from Fork back to Original) -->
    <path d="M 312 124 L 312 195 L 115 195 L 115 128" class="arrow" stroke="#10b981" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
    <rect x="150" y="185" width="130" height="20" rx="10" fill="#10b981"/>
    <text x="156" y="199" class="mono-pill">Cross-Repo Pull Request</text>

    <!-- Clone & Push between Personal Fork & Laptop -->
    <path d="M 350 124 L 350 236" class="arrow" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
    <rect x="305" y="145" width="85" height="18" rx="9" fill="#7c3aed"/>
    <text x="312" y="157" class="mono-pill" font-size="9">git clone fork</text>

    <!-- Bottom Box: Laptop with 2 Remotes -->
    <g transform="translate(25, 240)">
      <rect width="370" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="16" y="26" class="title">Contributor's Laptop</text>
      <text x="16" y="44" class="subtext">• Clones personal fork (origin)</text>
      <text x="16" y="60" class="subtext">• Adds upstream: git remote add upstream &lt;original-url&gt;</text>
      <text x="16" y="76" class="subtext">• Syncs updates: git fetch upstream &amp;&amp; git merge upstream/main</text>
      <rect x="16" y="88" width="338" height="20" rx="4" fill="#f1f5f9"/>
      <text x="24" y="102" class="subtext" font-weight="600" fill="#334155">Two remotes: origin (fork) + upstream (source)</text>
    </g>
  </g>
</svg>
