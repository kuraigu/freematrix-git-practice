<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <style>
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .arrow { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="880" height="200" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1: Branch -->
  <g transform="translate(20, 25)">
    <rect width="145" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="12" fill="#2563eb"/>
    <text x="25" y="30" class="step-num">1</text>
    <text x="14" y="60" class="step-title">Create Branch</text>
    <text x="14" y="78" class="step-sub">git switch -c</text>
    <text x="14" y="92" class="step-sub">community/your-name</text>
    <rect x="14" y="112" width="117" height="22" rx="4" fill="#eff6ff"/>
    <text x="20" y="127" class="step-sub" fill="#1e40af" font-weight="600">Isolated sandbox</text>
  </g>

  <path d="M 172 100 L 192 100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Push & Open PR -->
  <g transform="translate(196, 25)">
    <rect width="145" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="12" fill="#0284c7"/>
    <text x="25" y="30" class="step-num">2</text>
    <text x="14" y="60" class="step-title">Open PR</text>
    <text x="14" y="78" class="step-sub">Push branch &amp; open</text>
    <text x="14" y="92" class="step-sub">Pull Request on GitHub</text>
    <rect x="14" y="112" width="117" height="22" rx="4" fill="#f0f9ff"/>
    <text x="20" y="127" class="step-sub" fill="#0369a1" font-weight="600">Assign @kuraigu</text>
  </g>

  <path d="M 348 100 L 368 100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Review & Diff -->
  <g transform="translate(372, 25)">
    <rect width="150" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="12" fill="#7c3aed"/>
    <text x="25" y="30" class="step-num">3</text>
    <text x="14" y="60" class="step-title">Team Review</text>
    <text x="14" y="78" class="step-sub">Review diff line-by-line</text>
    <text x="14" y="92" class="step-sub">Suggest inline changes</text>
    <rect x="14" y="112" width="122" height="22" rx="4" fill="#faf5ff"/>
    <text x="20" y="127" class="step-sub" fill="#6b21a8" font-weight="600">Collaborative edits</text>
  </g>

  <path d="M 529 100 L 549 100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Iteration -->
  <g transform="translate(553, 25)">
    <rect width="140" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="12" fill="#d97706"/>
    <text x="25" y="30" class="step-num">4</text>
    <text x="14" y="60" class="step-title">Push Fixes</text>
    <text x="14" y="78" class="step-sub">Commit feedback</text>
    <text x="14" y="92" class="step-sub">PR auto-updates</text>
    <rect x="14" y="112" width="112" height="22" rx="4" fill="#fffbeb"/>
    <text x="18" y="127" class="step-sub" fill="#b45309" font-weight="600">No new PR needed</text>
  </g>

  <path d="M 700 100 L 720 100" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Merge -->
  <g transform="translate(724, 25)">
    <rect width="135" height="150" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="12" fill="#10b981"/>
    <text x="25" y="30" class="step-num">5</text>
    <text x="14" y="60" class="step-title" fill="#047857">Squash &amp; Merge</text>
    <text x="14" y="78" class="step-sub">Combines into clean</text>
    <text x="14" y="92" class="step-sub">commit on main</text>
    <rect x="14" y="112" width="107" height="22" rx="4" fill="#ecfdf5"/>
    <text x="18" y="127" class="step-sub" fill="#047857" font-weight="600">Live in production</text>
  </g>
</svg>
