<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .text-pill { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .text-pill-dark { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrow-dashed { stroke: #3b82f6; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="920" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Local Machine Zone -->
  <rect x="24" y="24" width="630" height="272" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="24" y="24" width="630" height="36" rx="12" fill="#f1f5f9"/>
  <path d="M 24 60 L 654 60" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="42" r="5" fill="#ef4444"/>
  <circle cx="60" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="42" r="5" fill="#10b981"/>
  <text x="96" y="46" class="section-label" fill="#475569">Your Computer (Local / Offline Workspace)</text>

  <!-- Box 1: Working Directory -->
  <g transform="translate(48, 88)">
    <rect width="165" height="180" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#fee2e2"/>
    <text x="23" y="38" font-size="18">📝</text>
    <text x="14" y="74" class="text-title" fill="#991b1b">Working Copy</text>
    <text x="14" y="96" class="text-sub">Where you edit and</text>
    <text x="14" y="112" class="text-sub">save code files right</text>
    <text x="14" y="128" class="text-sub">now in VS Code.</text>
    <rect x="14" y="146" width="137" height="22" rx="6" fill="#fee2e2"/>
    <text x="20" y="161" class="text-sub" fill="#b91c1c" font-weight="600">State: Untracked / Dirty</text>
  </g>

  <!-- Arrow 1: git add -->
  <path d="M 213 178 L 253 178" class="arrow" marker-end="url(#arrowhead)"/>
  <rect x="210" y="138" width="60" height="24" rx="12" fill="#2563eb"/>
  <text x="216" y="154" class="text-pill">git add</text>

  <!-- Box 2: Staging Area -->
  <g transform="translate(265, 88)">
    <rect width="165" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#dbeafe"/>
    <text x="23" y="38" font-size="18">🛒</text>
    <text x="14" y="74" class="text-title" fill="#1e40af">Staging Area</text>
    <text x="14" y="96" class="text-sub">The "shopping cart".</text>
    <text x="14" y="112" class="text-sub">Prepares exactly what</text>
    <text x="14" y="128" class="text-sub">goes into next snapshot.</text>
    <rect x="14" y="146" width="137" height="22" rx="6" fill="#dbeafe"/>
    <text x="20" y="161" class="text-sub" fill="#1d4ed8" font-weight="600">State: Staged for commit</text>
  </g>

  <!-- Arrow 2: git commit -->
  <path d="M 430 178 L 470 178" class="arrow" marker-end="url(#arrowhead)"/>
  <rect x="424" y="138" width="76" height="24" rx="12" fill="#7c3aed"/>
  <text x="430" y="154" class="text-pill">git commit</text>

  <!-- Box 3: Local Git Repository -->
  <g transform="translate(479, 88)">
    <rect width="165" height="180" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#f3e8ff"/>
    <text x="23" y="38" font-size="18">📦</text>
    <text x="14" y="74" class="text-title" fill="#6b21a8">Local History</text>
    <text x="14" y="96" class="text-sub">Permanent snapshots</text>
    <text x="14" y="112" class="text-sub">locked into the hidden</text>
    <text x="14" y="128" class="text-sub">.git folder on disk.</text>
    <rect x="14" y="146" width="137" height="22" rx="6" fill="#f3e8ff"/>
    <text x="20" y="161" class="text-sub" fill="#7e22ce" font-weight="600">State: Committed</text>
  </g>

  <!-- Connectors between Local & GitHub -->
  <!-- git push (top arc) -->
  <path d="M 644 148 C 674 148, 680 148, 706 148" class="arrow" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowhead-green)"/>
  <rect x="646" y="122" width="62" height="22" rx="11" fill="#10b981"/>
  <text x="653" y="137" class="text-pill">git push</text>

  <!-- git pull (bottom arc) -->
  <path d="M 708 208 C 680 208, 674 208, 646 208" class="arrow" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <rect x="648" y="214" width="58" height="22" rx="11" fill="#3b82f6"/>
  <text x="655" y="229" class="text-pill">git pull</text>

  <!-- Right: GitHub Cloud Zone -->
  <g transform="translate(714, 24)">
    <rect width="182" height="272" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect width="182" height="36" rx="12" fill="#ecfdf5"/>
    <path d="M 0 36 L 182 36" stroke="#d1fae5" stroke-width="1"/>
    <text x="16" y="23" class="section-label" fill="#047857">GitHub Cloud</text>
    
    <g transform="translate(14, 52)">
      <rect width="154" height="202" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="14" y="16" width="32" height="32" rx="8" fill="#dcfce7"/>
      <text x="23" y="38" font-size="18">☁️</text>
      <text x="14" y="74" class="text-title" fill="#14532d">Central Repo</text>
      <text x="14" y="96" class="text-sub">Shared single source</text>
      <text x="14" y="112" class="text-sub">of truth for founders.</text>
      <text x="14" y="134" class="text-sub" font-weight="600" fill="#15803d">• Code Reviews (PR)</text>
      <text x="14" y="152" class="text-sub" font-weight="600" fill="#15803d">• Issue Tracker</text>
      <text x="14" y="170" class="text-sub" font-weight="600" fill="#15803d">• Auto Cloud Backups</text>
    </g>
  </g>
</svg>
